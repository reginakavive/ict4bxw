
name: deploy-shiny

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0,3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-shiny-production
  cancel-in-progress: false

jobs:
  deploy-shiny:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rsconnect
            any::shiny
            any::sf
            any::sp
            any::raster
            any::plotly
            any::leaflet
            any::mapview
            any::ggplot2
            any::tidyverse
            any::dplyr
            any::tidyr
            any::lubridate
            any::magrittr
            any::shinyWidgets
            any::shinyjs
            any::naniar
            any::gstat
            any::bslib
            any::zoo
            any::png
            any::latticeExtra
            any::pagedown
            any::rmarkdown
            any::httr
            any::jsonlite
            any::AsioHeaders
            any::cpp11
            any::geometries
            any::jsonify
            any::progress
            any::rapidjsonr
            any::RcppEigen
            any::sfheaders

      - name: Import Firebase data
        env:
          FIRE_KEY: ${{ secrets.FIRE_KEY }}
        run: Rscript firebaseimport.R

      - name: Validate imported data
        shell: Rscript {0}
        run: |
          csv <- "data/Diagnosis_result_Direct.csv"

          if (!file.exists(csv)) {
            stop("Diagnosis CSV missing")
          }

          df <- read.csv(csv)

          cat("Imported records:", nrow(df), "\n")

          if (nrow(df) < 100) {
            stop("Too few records. Deployment cancelled.")
          }

      - name: Inspect deployment dependencies
        shell: Rscript {0}
        run: |
          app_files <- c(
            "app.R",
            "admin_name_cleaning.R",
            "dataprep.R",
            "part.R",
            "data"
          )

          print(rsconnect::appDependencies(
            appDir = ".",
            appFiles = app_files
          ))

      - name: Deploy to shinyapps.io
        env:
          SHINY_ACC_NAME: ${{ secrets.SHINY_ACC_NAME }}
          TOKEN: ${{ secrets.TOKEN }}
          SECRET: ${{ secrets.SECRET }}
      
        shell: Rscript {0}
        run: |
          # Map package repository names to valid HTTPS URLs
          options(repos = c(
            CRAN = "https://cloud.r-project.org",
            RSPM = "https://cloud.r-project.org"
          ))
      
          app_files <- c(
            "app.R",
            "admin_name_cleaning.R",
            "dataprep.R",
            "part.R",
            "data"
          )
      
          # Validate package repository metadata
          deps <- rsconnect::appDependencies(
            appDir = ".",
            appFiles = app_files
          )
      
          rcpp <- deps[deps$Package == "RcppEigen", ]
      
          if (nrow(rcpp) > 0) {
            cat("RcppEigen dependency:\n")
            print(rcpp)
      
            valid_url <- !is.na(rcpp$Repository) &
              grepl("^https?://", rcpp$Repository)
      
            if (!all(valid_url)) {
              stop(
                "RcppEigen has an invalid repository URL: ",
                paste(rcpp$Repository, collapse = ", ")
              )
            }
          }
      
          # Authenticate
          rsconnect::setAccountInfo(
            name = Sys.getenv("SHINY_ACC_NAME"),
            token = Sys.getenv("TOKEN"),
            secret = Sys.getenv("SECRET")
          )
      
          # Deploy application
          rsconnect::deployApp(
            appDir = ".",
            appFiles = app_files,
            appName = "bxwsurveillancettFF",
            forceUpdate = TRUE,
            launch.browser = FALSE,
            logLevel = "verbose"
          )

