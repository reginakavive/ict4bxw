
name: deploy-shiny

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 0 * * 0,3"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shiny-production
  cancel-in-progress: false

jobs:
  deploy-shiny:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      MAKEFLAGS: "-j1"
      SHINY_ACC_NAME: ${{ secrets.SHINY_ACC_NAME }}
      SHINY_TOKEN: ${{ secrets.TOKEN }}
      SHINY_SECRET: ${{ secrets.SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libmagick++-dev \
            libcairo2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rsconnect
            any::shiny
            any::sf
            any::raster
            any::leaflet
            any::tidyverse
            any::plotly
            any::shinyjs
            any::shinyWidgets
            any::gstat
            any::mapview
            any::magick
            any::Cairo
            any::naniar
            any::latticeExtra
            any::gganimate
            any::ggrepel
            any::gtools
            any::zoo
          cache: true

      - name: Import Firebase data
        run: Rscript firebaseimport.R

      - name: Deploy to shinyapps.io
        shell: Rscript {0}
        run: |
          rsconnect::setAccountInfo(
            name = Sys.getenv("SHINY_ACC_NAME"),
            token = Sys.getenv("SHINY_TOKEN"),
            secret = Sys.getenv("SHINY_SECRET")
          )

          rsconnect::deployApp(
            appDir = ".",
            appName = "bxwsurveillancettF2",
            forceUpdate = TRUE,
            launch.browser = FALSE
          )
