on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0,3'
  

name: deploy-shiny

jobs:
  deploy-shiny:
    runs-on: macOS-latest
    steps:
    
      - uses: actions/checkout@v3
      - uses: r-lib/actions/setup-r@v2
        with: 
          r-version: '4.4.3'
      
      - name: Install dependencies
        run: |
          install.packages("rsconnect")
                    
          
          install.packages(c('shiny','units','remotes','sp','tidyverse', 'zoo',  'latticeExtra',  'lubridate', 'magrittr', 'httr','jsonlite','magrittr','tools','dplyr',
                   'naniar', 'plotly', 'png',   'rmarkdown', 'scales', 'shiny', 'shinyjs','shinyWidgets','raster','sf','tidyverse','gstat','leaflet','mapview','BH',
                   'gganimate','ggrepel', 'gtools', 'magick', 'websocket','pagedown', 'bookdown', 'readxl','cronR','rsconnect','devtools'
                    ))
          
          
        shell: Rscript {0}
        
      - name: Import data
        env:
          FIRE_KEY: ${{ secrets.FIRE_KEY }}
        run: Rscript firebaseimport.R
        
      - name: Push to shinyapps.io
        run: |          

    
          rsconnect::setAccountInfo(name="${{secrets.SHINY_ACC_NAME}}", token="${{secrets.TOKEN}}", secret="${{secrets.SECRET}}")
          rsconnect::deployApp(appDir = ".",appFiles = c("app.R", "admin_name_cleaning.R", "dataprep.R","part.R",  "data"), appName = "bxwsurveillancettFF", forceUpdate = TRUE)
          
          
        shell: Rscript {0}
